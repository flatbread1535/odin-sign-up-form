<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Add fonts here */
    </style>
</head>

<body>
    <div class="left">
        <!-- logo title here -->
        <img src="banner.jpg" alt="Banner">
        <!-- Credits to image here -->
    </div>
    <div class="right">
        <div class="top">
            <div>This is not a real online service! You know you need something like this in your life to help you
                realize your deepest dreams. Sign up <span>now</span> to get started.</div>
            <div>You <span>know</span> you want to.</div>
        </div>
        <form action="#" method="post">
            <div class="info">
                <div>Let's do this!</div>
                <div class="info-row">
                    <div>
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="first_name" placeholder="John" required>
                    </div>
                    <div>
                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="last_name" placeholder="Doe" required>
                    </div>
                </div>
                <div class="info-row">
                    <div>
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com">
                    </div>
                    <div>
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="phone" placeholder="123-456-7890">
                    </div>
                </div>
                <div class="info-row">
                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm_pw">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_pw" name="confirm_pw" required>
                    </div>
                </div>
            </div>
            <button type="submit">Create Account</button>
        </form>
        <div class="login">
            <div>Already have an account? <a href="#" class="login-link">Log in</a></div>
        </div>
    </div>
</body>

</html>
